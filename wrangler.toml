# Cloudflare Workers config for norns-demo — served at norns-demo.humansynthesis.ai.
#
# Compat flags required by the norns runtime:
#   nodejs_als     → AsyncLocalStorage (per-request DI scope, event.locals.container)
#   nodejs_compat  → general Node compat layer
#
# D1 is bound as `DB`; both notes examples (Norns + vanilla) read it from
# `event.platform.env.DB`. Migrations live in migrations/notes/ and are applied
# with wrangler: `bun run db:migrate` (local) / `bun run db:migrate:remote` (prod).
# Under `vite dev`, adapter-cloudflare's platform proxy reads this file and
# serves a local D1 from .wrangler/state/.

name = "norns-demo"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_als", "nodejs_compat"]

routes = [
	{ pattern = "norns-demo.humansynthesis.ai", custom_domain = true }
]

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "norns-demo-notes"
database_id = "23f83855-efd1-4189-8092-83cd92ed841b"
migrations_dir = "migrations/notes"
