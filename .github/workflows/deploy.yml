name: Deploy

# Deploys norns-demo to Cloudflare Workers (norns-demo.humansynthesis.ai) on
# every push to main. Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN  — token with Workers Scripts:Edit + D1:Edit
#   CLOUDFLARE_ACCOUNT_ID — the account that owns the humansynthesis.ai zone

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.16'

      - name: Install dependencies
        run: bun install

      - name: Lint (norns lint)
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: d1 migrations apply norns-demo-notes --remote

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy
